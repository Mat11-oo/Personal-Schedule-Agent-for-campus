    <style>
      #splash{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;padding:32px;background:#fbfaf9;color:#343433;text-align:center;animation:splash-out .2s 1300ms both}
      #splash.splash-leaving{opacity:0;visibility:hidden;pointer-events:none;animation:none}
      .splash-inner{position:relative;max-width:640px}
      .splash-scene{width:min(600px,86vw);margin:0 auto 16px;opacity:0;animation:splash-rise .45s .05s ease-out forwards}
      .splash-scene svg{display:block;width:100%;height:auto;overflow:visible}
      .scene-land{stroke:#343433;stroke-width:1.6;stroke-linejoin:round}
      .island-left .scene-land{fill:#ffcd6c}
      .island-right .scene-land{fill:#64c6ff}
      .scene-rim{fill:none;stroke:#ffffff;stroke-width:2;stroke-linecap:round;opacity:.9}
      .scene-wave{fill:none;stroke:#343433;stroke-width:1.4;stroke-linecap:round;opacity:.32}
      .scene-wave.wave-2{opacity:.15}
      .scene-sun{fill:#ffcd6c;stroke:#343433;stroke-width:1.6}
      .island-left{animation:island-left .95s cubic-bezier(.2,.7,.25,1) .05s both}
      .island-right{animation:island-right .95s cubic-bezier(.2,.7,.25,1) .12s both}
      @keyframes island-left{0%{opacity:0;transform:translateX(-30px)}35%{opacity:1}100%{opacity:1;transform:none}}
      @keyframes island-right{0%{opacity:0;transform:translateX(30px)}35%{opacity:1}100%{opacity:1;transform:none}}
      .stone{stroke:#343433;stroke-width:2.4;stroke-linecap:round;opacity:0;animation:splash-fade .22s ease-out forwards}
      .stone-1{animation-delay:.34s}
      .stone-2{animation-delay:.44s}
      .stone-3{animation-delay:.54s}
      .stone-4{animation-delay:.64s}
      .scene-spark{fill:#ff3e00;stroke:#343433;stroke-width:1;opacity:0;animation:splash-fade .3s .9s ease-out forwards}
      .bridge-line{fill:none;stroke:#ff3e00;stroke-width:1.6;stroke-linecap:round;opacity:0;stroke-dasharray:1;stroke-dashoffset:1;animation:bridge-draw .42s .68s ease-out forwards}
      @keyframes bridge-draw{to{opacity:.75;stroke-dashoffset:0}}
      .confetti{opacity:0;animation:splash-pop .45s ease-out forwards}
      .c-star{animation-delay:.5s}
      .c-coin{animation-delay:.66s}
      .c-heart{animation-delay:.58s}
      .c-leaf{animation-delay:.72s}
      .c-spark{animation-delay:.8s}
      .splash-name{margin:0 0 22px;font-size:12px;letter-spacing:.32em;color:#7e7e7d;opacity:0;animation:splash-rise .32s .18s ease-out forwards}
      .splash-slogan{margin:0;font-size:clamp(18px,2.2vw,23px);font-weight:600;line-height:1.9;letter-spacing:-.01em;color:#121212}
      .splash-slogan .line{display:block;opacity:0;animation:splash-rise .38s ease-out forwards}
      .splash-slogan .line-1{animation-delay:.26s}
      .splash-slogan .line-2{margin-top:6px;font-weight:400;font-size:.9em;color:#474645;animation-delay:.56s}
      @keyframes splash-pop{from{opacity:0;transform:translateY(10px) scale(.9)}to{opacity:1;transform:none}}
      @keyframes splash-fade{to{opacity:1}}
      @keyframes splash-rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
      @keyframes splash-out{from{opacity:1;visibility:visible}to{opacity:0;visibility:hidden}}
      @media (prefers-reduced-motion:reduce){#splash,.splash-scene,.island-left,.island-right,.stone,.scene-spark,.bridge-line,.confetti,.splash-name,.splash-slogan,.splash-slogan .line{animation:none!important;opacity:1!important;transition:none!important}.bridge-line{opacity:.75;stroke-dashoffset:0}}
      @media print{#splash{display:none}}
    </style>
    <noscript><style>#splash{display:none}</style></noscript>

  <body>
    <div id="splash" role="status" aria-label="学屿正在打开">

          </svg>
        </div>
        <p class="splash-name">学屿 · CAMPUS ISLAND</p>
        <p class="splash-slogan"><span class="line line-1">我们本是各自独立的岛屿，</span><span class="line line-2">愿我跨越隔阂，来到你的身边，建立联结。</span></p>
      </div>
    </div>
    <script>
      (function () {
        var splash = document.getElementById('splash');
        if (!splash) return;
        var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        var remove = function () { splash.remove(); };
        if (reduce) {
          setTimeout(function () { splash.classList.add('splash-leaving'); remove(); }, 480);
          return;
        }
        // 1.5s 由 CSS 动画驱动（1300ms 停留 + 200ms 淡出），不依赖主线程定时器
        splash.addEventListener('animationend', function (event) {
          if (event.target === splash && event.animationName === 'splash-out') remove();
        });
        setTimeout(function () { if (document.body.contains(splash)) splash.remove(); }, 1800);
      })();
    </script>
